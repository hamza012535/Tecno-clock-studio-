name: Android Build & Komi Store Release

# Required GitHub Repository Secrets for signed release APKs (see SECRETS.md):
# - ANDROID_KEYSTORE_FILE      : Base64-encoded .jks / .keystore signing file
# - ANDROID_KEYSTORE_PASSWORD  : Keystore store password
# - ANDROID_KEY_ALIAS          : Key alias inside the keystore (defaults to "upload")
# - ANDROID_KEY_PASSWORD       : Key password for the alias

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a public non-draft GitHub Release'
        type: boolean
        required: true
        default: true
      tag_name:
        description: 'Version tag when publishing manually (e.g. v1.0.0)'
        type: string
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Ensure Android SDK Licenses Accepted
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"

      - name: Restore Debug Keystore for Gradle Debug Signing Config
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              tr -d ' \t\r\n' < debug.keystore.base64 | base64 --decode > debug.keystore
            else
              keytool -genkeypair -noprompt -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Compute versionCode and versionName
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_release }}" == "true" ]]; then
            RAW_TAG="${{ inputs.tag_name }}"
            RAW_TAG="${RAW_TAG:-v1.0.0}"
            [[ "$RAW_TAG" == v* ]] || RAW_TAG="v${RAW_TAG}"
          else
            RAW_TAG=""
          fi

          if [[ -n "$RAW_TAG" ]]; then
            TAG="${RAW_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${TAG%%-*}"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            VERSION_NAME="$TAG"
            RELEASE_TAG="$RAW_TAG"
          else
            VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
            VERSION_NAME="0.0.${GITHUB_RUN_NUMBER}-snapshot"
            RELEASE_TAG=""
          fi

          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore from GitHub Secret
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 --decode > "${{ runner.temp }}/release.keystore"
            ALIAS_TO_USE="${KEY_ALIAS:-upload}"
            if [ "$ALIAS_TO_USE" != "upload" ]; then
              keytool -changealias \
                -keystore "${{ runner.temp }}/release.keystore" \
                -alias "$ALIAS_TO_USE" \
                -destalias "upload" \
                -storepass "$STORE_PASS" \
                -keypass "$KEY_PASS"
            fi
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_PATH=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${STORE_PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured; building debug APK."
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build Release APK
        if: steps.signing.outputs.has_keystore == 'true'
        run: gradle assembleRelease --no-daemon

      - name: Build Debug APK (Snapshot / Missing Keystore Fallback)
        if: steps.signing.outputs.has_keystore != 'true'
        run: gradle assembleDebug --no-daemon

      - name: Sign & Verify Release APK with apksigner
        id: sign_apk
        if: steps.signing.outputs.has_keystore == 'true'
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_DIR"/build-tools/* | sort -V | tail -n 1)
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          FINAL_APK="${{ runner.temp }}/tecno-clock-studio-v${{ steps.version.outputs.version_name }}-release.apk"

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$RAW_APK" "${{ runner.temp }}/aligned.apk"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "${{ runner.temp }}/release.keystore" \
            --ks-pass "env:STORE_PASSWORD" \
            --ks-key-alias "upload" \
            --key-pass "env:KEY_PASSWORD" \
            --out "$FINAL_APK" \
            "${{ runner.temp }}/aligned.apk"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$FINAL_APK"
          mkdir -p dist
          cp "$FINAL_APK" "dist/"
          echo "apk_path=dist/$(basename "$FINAL_APK")" >> "$GITHUB_OUTPUT"

      - name: Prepare Debug APK Artifact
        if: steps.signing.outputs.has_keystore != 'true'
        run: |
          RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          mkdir -p dist
          cp "$RAW_APK" "dist/tecno-clock-studio-v${{ steps.version.outputs.version_name }}-debug.apk"

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tecno-clock-studio-apk
          path: dist/*.apk
          retention-days: 30

      - name: Cleanup temporary keystores
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore" "${{ runner.temp }}/aligned.apk"

  release:
    name: Publish GitHub Release & Komi Store
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: tecno-clock-studio-apk
          path: dist

      - name: Create Non-Draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: Tecno Clock Studio ${{ needs.build.outputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Register Release with Komi Store CLI
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if command -v komi >/dev/null 2>&1; then
            komi publish --tag "${{ needs.build.outputs.release_tag }}"
          elif command -v npx >/dev/null 2>&1; then
            npx --yes komi-cli publish --tag "${{ needs.build.outputs.release_tag }}" || true
          else
            echo "Komi CLI not preinstalled; public GitHub Release will be auto-indexed by Komi Store Search API."
          fi
